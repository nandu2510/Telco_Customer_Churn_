<!DOCTYPE html>
<html>
<head>
    <title>Customer Churn Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }
        .container {
            margin-top: 30px;
        }
        .card {
            padding: 20px;
            border-radius: 15px;
        }
        .result-box {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h2 class="text-center mb-4">Customer Churn Analysis</h2>

    <form method="POST">

        <div class="row">

            <!-- LEFT COLUMN -->
            <div class="col-md-6">

                <label>Gender</label>
                <select class="form-control" name="query4">
                    <option>Male</option>
                    <option>Female</option>
                </select><br>

                <label>Senior Citizen</label>
                <select class="form-control" name="query1">
                    <option>0</option>
                    <option>1</option>
                </select><br>

                <label>Partner</label>
                <select class="form-control" name="query5">
                    <option>Yes</option>
                    <option>No</option>
                </select><br>

                <label>Dependents</label>
                <select class="form-control" name="query6">
                    <option>Yes</option>
                    <option>No</option>
                </select><br>

                <label>Contract</label>
                <select class="form-control" name="query16">
                    <option>Month-to-month</option>
                    <option>One year</option>
                    <option>Two year</option>
                </select><br>

            </div>

            <!-- RIGHT COLUMN -->
            <div class="col-md-6">

                <label>Internet Service</label>
                <select class="form-control" name="query9">
                    <option>DSL</option>
                    <option>Fiber optic</option>
                    <option>No</option>
                </select><br>

                <label>Payment Method</label>
                <select class="form-control" name="query18">
                    <option>Electronic check</option>
                    <option>Mailed check</option>
                    <option>Bank transfer (automatic)</option>
                    <option>Credit card (automatic)</option>
                </select><br>

                <label>Monthly Charges</label>
                <input class="form-control" name="query2" type="number"><br>

                <label>Total Charges</label>
                <input class="form-control" name="query3" type="number"><br>

                <label>Tenure (months)</label>
                <input class="form-control" name="query19" type="number"><br>

            </div>

        </div>

        <div class="text-center">
            <button class="btn btn-primary btn-lg mt-3">Predict</button>
        </div>

    </form>

    <br>

    {% if output1 %}
    <div class="card result-box">
        <p>{{ output1 }}</p>
        <p>{{ output2 }}</p>
    </div>
    {% endif %}

</div>

</body>
</html>
